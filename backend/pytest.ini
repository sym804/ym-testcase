[pytest]
testpaths = .
cache_dir = .pytest_cache
tmp_path_retention_policy = none
filterwarnings =
    ignore::pytest.PytestCacheWarning
    # SQLAlchemy 모델 TestCase / TestCaseSheet 를 테스트 클래스로 수집하려다
    # 나는 경고. python_classes 로 막으면 실제 테스트 클래스 33개가 같이 빠진다.
    ignore::pytest.PytestCollectionWarning
